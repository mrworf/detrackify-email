name: Test Docker Build

on:
  pull_request:
    branches: [ main ]

jobs:
  test-build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Guard Docker image (test only)
      uses: docker/build-push-action@v5
      with:
        context: .
        platforms: linux/amd64
        push: false
        tags: detrackify-guard:test
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Test Guard Docker image
      run: |
        # Start the container in background
        docker run -d --name test-guard \
          -e GUARD_SALT=test-salt-123 \
          -p 9090:9090 \
          detrackify-guard:test
        
        # Wait for container to start
        sleep 10
        
        # Test health endpoint
        curl -f http://localhost:9090/guard/health || exit 1
        
        # Clean up
        docker stop test-guard
        docker rm test-guard

    - name: Build LMTP Docker image (test only)
      uses: docker/build-push-action@v5
      with:
        context: .
        file: Dockerfile.lmtp
        platforms: linux/amd64
        push: false
        tags: detrackify-lmtp:test
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Test LMTP Docker image
      run: |
        # Start the container with a dummy downstream (will not be reached)
        docker run -d --name test-lmtp \
          -e LMTP_DOWNSTREAM=127.0.0.1:24 \
          -p 10024:10024 \
          detrackify-lmtp:test
        
        # Wait for container to start
        sleep 5
        
        # Test TCP connection to LMTP port
        python3 -c "import socket; s=socket.socket(); s.settimeout(5); s.connect(('127.0.0.1', 10024)); data=s.recv(1024); assert b'220' in data; s.close(); print('LMTP server responded:', data.decode())"
        
        # Clean up
        docker stop test-lmtp
        docker rm test-lmtp

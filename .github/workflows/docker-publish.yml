name: Build and Publish Docker Images

on:
  push:
    branches: [ develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - image: mrworf/detrackify-guard
            dockerfile: Dockerfile
          - image: mrworf/detrackify-lmtp
            dockerfile: Dockerfile.lmtp

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Container Registry
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Determine tags
      id: tags
      run: |
        # Always include SHA tag for traceability
        TAGS="${{ env.REGISTRY }}/${{ matrix.image }}:${{ github.sha }}"
        
        # Add dev tag for develop branch pushes
        if [[ "${{ github.ref }}" == "refs/heads/develop" ]]; then
          TAGS="${{ env.REGISTRY }}/${{ matrix.image }}:dev,$TAGS"
        fi
        
        # Add version tag for releases
        if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
          VERSION=${GITHUB_REF#refs/tags/}
          TAGS="${{ env.REGISTRY }}/${{ matrix.image }}:$VERSION,$TAGS"
        fi
        
        echo "tags=$TAGS" >> $GITHUB_OUTPUT
        echo "Using tags: $TAGS"

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ${{ matrix.dockerfile }}
        platforms: linux/amd64,linux/arm64
        push: ${{ github.event_name != 'pull_request' }}
        tags: ${{ steps.tags.outputs.tags }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Build completed
      if: github.event_name != 'pull_request'
      run: echo "${{ matrix.image }} image built and pushed successfully"

events {
    worker_connections 1024;
}

http {
    upstream detrackify_guard {
        server detrackify-guard:9090;
    }

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=guard:10m rate=10r/s;

    server {
        listen 80;
        server_name guard.example.com;  # Change this to your domain

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Guard endpoints
        location /guard/ {
            limit_req zone=guard burst=20 nodelay;
            
            proxy_pass http://detrackify_guard/guard/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Timeouts
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        # Resource endpoints
        location /resources/ {
            limit_req zone=guard burst=20 nodelay;
            
            proxy_pass http://detrackify_guard/resources/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Health check endpoint
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # Default location
        location / {
            return 404;
        }
    }


# Docker Compose configuration for Detrackify Guard Server
# See DOCKER.md for complete documentation and configuration options
version: '3.8'

services:
  detrackify-guard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: detrackify-guard
    ports:
      - "9090:9090"
    environment:
      # Required
      # Use either CONFIG_FILE (preferred) or GUARD_SALT
      # - GUARD_SALT=changeme123  # Change this to a secure salt
      
      # Server mode (true for Gunicorn, false for direct Flask)
      - USE_GUNICORN=true
      
      # Gunicorn configuration (only used when USE_GUNICORN=true)
      - GUNICORN_WORKERS=4  # Number of worker processes
      - GUNICORN_WORKER_CLASS=sync  # Worker class: sync, gevent, eventlet
      - GUNICORN_TIMEOUT=30  # Worker timeout in seconds
      - GUNICORN_KEEPALIVE=2  # Keep-alive timeout
      - GUNICORN_MAX_REQUESTS=1000  # Max requests per worker before restart
      - GUNICORN_MAX_REQUESTS_JITTER=100  # Jitter for max requests
      - GUNICORN_GRACEFUL_TIMEOUT=30  # Graceful shutdown timeout
      - GUNICORN_LOG_LEVEL=info  # Log level: debug, info, warning, error
      - GUNICORN_BIND=0.0.0.0:9090  # Bind address
      
      # Application configuration
      - TIMEOUT=5
      - PRIVACY=false
      - RESOLVE=head
      - RESOLVE_CACHE_FILE=/app/cache/resolve_cache.json
      - RESOLVE_CACHE_DAYS=30
      - RESOLVE_CACHE_MAX=4096
      - USER_AGENT=Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36
      
      # Multiple strip-param-prefix values (comma-separated or individual vars)
      - STRIP_PARAM_PREFIX=utm_source,utm_medium,utm_campaign
      # Alternative: use individual variables
      # - STRIP_PARAM_PREFIX_1=utm_source
      # - STRIP_PARAM_PREFIX_2=utm_medium
      # - STRIP_PARAM_PREFIX_3=utm_campaign
    volumes:
      # Mount unified configuration file (preferred). Entry point will auto-detect /app/config.yml.
      - ./examples/config_guard_server.yml:/app/config.yml:ro
      # Optional: Mount custom templates
      - ./templates:/app/templates:ro
      # Optional: Mount custom resources
      - ./resources:/app/resources:ro
      # Optional: Persist URL resolution cache
      - ./cache:/app/cache
    # Command is handled by the entrypoint script. No CONFIG_FILE needed; it auto-detects mounted config.
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:9090/guard/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    # The guard server listens on 0.0.0.0 by default in Docker (see docker-entrypoint.sh)
    # This is required so nginx and other containers can connect to it.
    # Do NOT use 127.0.0.1 here, or only processes inside the same container will be able to connect.

  # Example with nginx reverse proxy
  nginx:
    image: nginx:alpine
    container_name: detrackify-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./extras/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro  # Optional: SSL certificates
    depends_on:
      - detrackify-guard
    restart: unless-stopped
    profiles:
      - proxy  # Only start with: docker-compose --profile proxy up 
# Example configuration for Detrackify Email with Phishing Detection
# This configuration enables guard functionality with phishing detection

# Email processing section
email:
  verbose: true
  guard:
    # Guard server configuration
    server: "https://your-guard-server.example.com"
    salt: "your-secure-salt-here-should-be-long-and-random"
    
    # Guard link mode:
    # - off: No link guarding
    # - mismatch: Guard only when sender domain doesn't match link domain
    # - always: Guard all links
    link: "mismatch"
    
    # Enable phishing detection
    # When enabled, analyzes sender display name vs email domain
    # If mismatch detected, forces all links to be guarded with 'phishy' block reason
    phishy: true
    
    # Capture recipient email in guarded links (optional)
    capture_to: false
    
    # Path to guard whitelist file (optional)
    whitelist_file: "guard_whitelist.yml"

# Additional configuration files
domain_aliases_file: "domain_aliases.yml"
blacklist_file: "blacklist.yml"
whitelist_file: "whitelist.yml"

# Example usage:
# python detrackify_email.py --config config_guard_with_phishing_detection.yml --input email.eml --output cleaned.eml

# The phishing detection works by comparing the sender's display name with their email domain.
# Examples of what would be flagged as suspicious:
# - Display Name: "Microsoft Support", Email: "support@suspicious-domain.com"
# - Display Name: "PayPal Security", Email: "noreply@random-site.net"
# - Display Name: "Amazon Customer Service", Email: "alerts@fake-amazon.xyz"
#
# Examples of what would NOT be flagged:
# - Display Name: "Microsoft Corporation", Email: "support@microsoft.com"
# - Display Name: "PayPal", Email: "service@paypal.com"
# - Display Name: "Amazon.com", Email: "no-reply@amazon.com" 
# Blacklist configuration for Detrackify
# This file contains URLs or senders that are blocked

# Blacklist entries - URLs or senders that are blocked
# Each entry must specify whether it's a 'sender' or 'url' pattern
blacklist:
  # Block specific sender email addresses
  - sender: '^spam@malicious\.com$'
  - sender: '^test.*@example\.org$'
  
  # Block specific URLs or domains
  - url: '^https://malicious\.com/.*'
  - url: '^https://.*\.phishing\.net/.*'
  - url: '^https://tracking\.example\.com/.*'
  
  # Block entire domains
  - url: '^https://.*\.suspicious\.org/.*'
  - url: '^https://.*\.malware\.com/.*'